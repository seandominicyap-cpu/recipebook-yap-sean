{% extends 'base.html' %} {% block heading_text %} 
    Recipe List {% endblock%}

{% block content %}
<ul>
    {% for recipe in recipes %}
        <li><a href="{{ recipe.get_absolute_url }}">{{ recipe.name }}</a></li>
    {% endfor %}
</ul>
{% if user.is_authenticated %}
    <p><a href="{% url 'ledger:recipe_add' %}">Create New Recipe</a></p>
{% endif %}

{% endblock %}
