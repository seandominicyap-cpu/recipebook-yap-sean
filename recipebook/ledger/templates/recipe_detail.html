{% extends 'base.html' %}
{% block content %}
<h2>{{ recipe.name }}</h2>
<ul>
    {% for ingredient in recipe.ingredients.all %}
        <li>{{ ingredient.ingredient.name }} ({{ ingredient.quantity }})</li>
    {% endfor %}
</ul>
<p><a href="{% url 'ledger:recipe_list' %}">Back to list</a></p>
{% endblock %}
